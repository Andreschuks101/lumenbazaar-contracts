[workspace]
members = [
    "contracts/policy-wallet-example",
    "contracts/test-token",
    "contracts/upto-session",
    "formal/escrow-model",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LumenRoute/lumenbazaar-contracts"
rust-version = "1.91"

[workspace.dependencies]
soroban-sdk = "28.0.0"

[profile.release]
overflow-checks = true
