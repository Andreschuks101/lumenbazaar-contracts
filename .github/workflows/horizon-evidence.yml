name: Horizon Evidence Verification

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * *"

permissions:
  contents: read

jobs:
  malware-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Scan for known malware indicators
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/security/scan_malware.py

  verify:
    needs: malware-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0

      - name: Verify published transactions against Horizon
        shell: bash
        run: |
          set +e
          node scripts/verify-horizon-evidence.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::Horizon was unavailable after bounded retries; no published evidence was contradicted. Rerun this workflow."
            exit 0
          fi
          if [ "$code" -eq 1 ]; then
            echo "::error::Horizon contradicts published testnet evidence at ${GITHUB_SHA}; see the job summary."
          fi
          exit "$code"
