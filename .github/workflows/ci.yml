name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.1
          rustup target add wasm32v1-none --toolchain 1.93.1

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.0.0/stellar-cli-28.0.0-x86_64-unknown-linux-gnu.tar.gz -o stellar-cli.tar.gz
          tar -xzf stellar-cli.tar.gz
          sudo mv stellar /usr/local/bin/stellar
          stellar version

      - name: Audit dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          node scripts/check-dependency-exceptions.mjs
          cargo audit --deny warnings --ignore RUSTSEC-2024-0436

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        env:
          LUMENBAZAAR_PROPERTY_CASES: "128"
        run: cargo test --workspace --all-features

      - name: Build WASM contracts
        run: stellar contract build --locked

      - name: Check generated specs
        run: |
          node scripts/generate-specs.mjs --skip-build
          git diff --exit-code -- artifacts/spec

      - name: Check TypeScript bindings
        run: |
          node scripts/generate-bindings.mjs --skip-build
          git diff --exit-code -- bindings/upto-session
          npm --prefix bindings/upto-session ci
          npm --prefix bindings/upto-session audit --omit=dev
          npm --prefix bindings/upto-session run build
          node scripts/smoke-upto-session-bindings.mjs

      - name: Check interface fixtures
        run: node scripts/generate-interface-fixtures.mjs --check

      - name: Check backend handoff
        run: |
          node scripts/check-domain-vectors.mjs
          node scripts/check-backend-handoff.mjs

      - name: Check security checklist
        run: node scripts/check-security-checklist.mjs

      - name: Check audit readiness
        run: node scripts/check-audit-readiness.mjs

      - name: Check public deployment evidence
        run: node scripts/check-deployment-evidence.mjs

      - name: Check public lifecycle evidence
        run: node scripts/check-testnet-lifecycle.mjs
