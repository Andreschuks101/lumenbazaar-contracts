name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  malware-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout submitted commit without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Scan for known malware indicators
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/security/scan_malware.py
          else
            PYTHONDONTWRITEBYTECODE=1 python scripts/security/scan_malware.py
          fi

  contracts:
    needs: malware-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.1
          rustup target add wasm32v1-none --toolchain 1.93.1

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0

      - name: Check release version consistency
        run: |
          node --test scripts/lib/release-versions.test.mjs
          node scripts/check-release-versions.mjs

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-versions.mjs --tag "$RELEASE_TAG"

      - name: Check deployment log redaction
        run: node --test scripts/lib/deployment-logging.test.mjs

      - name: Check deterministic transaction finality
        run: node --test scripts/lib/transaction-finality.test.mjs

      - name: Check test-token release guard
        run: |
          node --test scripts/lib/test-token-guard.test.mjs
          node scripts/check-test-token-guard.mjs

      - name: Check testnet WASM release verification
        run: node --test scripts/lib/wasm-release.test.mjs

      - name: Test changelog gate
        run: node --test scripts/lib/changelog-gate.test.mjs

      - name: Require contract-facing changelog entries
        if: github.event_name == 'pull_request'
        env:
          CHANGELOG_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-changelog.mjs --base "$CHANGELOG_BASE"

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.0.0/stellar-cli-28.0.0-x86_64-unknown-linux-gnu.tar.gz -o stellar-cli.tar.gz
          tar -xzf stellar-cli.tar.gz
          sudo mv stellar /usr/local/bin/stellar
          stellar version

      - name: Audit dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          node scripts/check-dependency-exceptions.mjs
          cargo audit --deny warnings --ignore RUSTSEC-2024-0436

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        env:
          LUMENBAZAAR_PROPERTY_CASES: "128"
        run: cargo test --workspace --all-features

      - name: Check resource and rent budgets
        run: |
          node scripts/report-resource-usage.mjs
          node --test scripts/lib/resource-budgets.test.mjs
          node scripts/check-resource-budgets.mjs

      - name: Model-check escrow state machine
        run: cargo test -p escrow-model -- --nocapture

      - name: Check replacement deployment rehearsal
        run: |
          node --test scripts/local/replacement-routing.test.mjs
          node scripts/local/rehearse-replacement.mjs --dry-run

      - name: Check Stellar CLI wrapper unit tests
        run: node --test scripts/lib/stellar-cli.test.mjs

      - name: Check native differential fixtures
        run: node scripts/run-native-rpc-differential.mjs --native-only

      - name: Build WASM contracts
        run: stellar contract build --locked

      - name: Generate dependency SBOM and build provenance
        run: |
          node --test scripts/lib/provenance.test.mjs
          node scripts/generate-provenance.mjs
          node scripts/check-provenance.mjs

      - name: Upload SBOM and build provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-build-provenance
          path: artifacts/provenance
          if-no-files-found: error

      - name: Check WASM size budgets
        run: node scripts/check-wasm-size-budget.mjs --report "${{ runner.temp }}/wasm-size-report.json"

      - name: Upload WASM size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-size-report
          path: ${{ runner.temp }}/wasm-size-report.json
          if-no-files-found: error

      - name: Check generated specs
        run: |
          node scripts/generate-specs.mjs --skip-build
          git diff --exit-code -- artifacts/spec

      - name: Check TypeScript bindings
        run: |
          node scripts/generate-bindings.mjs --skip-build
          git diff --exit-code -- bindings/upto-session
          npm --prefix bindings/upto-session ci
          npm --prefix bindings/upto-session audit --omit=dev
          npm --prefix bindings/upto-session run build
          npm --prefix bindings/upto-session pack --dry-run
          node scripts/smoke-upto-session-bindings.mjs
          node --test scripts/test-contract-errors.mjs
          node --test scripts/test-transaction-evidence.mjs

      - name: Check usage receipt commitments
        run: node scripts/check-usage-receipt-fixtures.mjs

      - name: Check interface fixtures
        run: node scripts/generate-interface-fixtures.mjs --check

      - name: Check indexed event topics
        run: |
          node --test scripts/lib/event-topics.test.mjs
          node scripts/check-event-topics.mjs

      - name: Check cross-release ABI compatibility
        run: |
          node scripts/test-abi-compatibility.mjs
          node scripts/check-abi-compatibility.mjs

      - name: Check backend handoff
        run: |
          node scripts/check-domain-vectors.mjs
          node scripts/check-backend-handoff.mjs

      - name: Check encoding compatibility vectors
        env:
          ENCODING_VECTORS_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node --test scripts/lib/encoding-vectors.test.mjs
          node scripts/check-encoding-vectors.mjs --base "$ENCODING_VECTORS_BASE"

      - name: Check security checklist
        run: node scripts/check-security-checklist.mjs

      - name: Check audit readiness
        run: node scripts/check-audit-readiness.mjs

      - name: Check public deployment evidence
        run: |
          node --test scripts/testnet/generate-public-manifest.test.mjs scripts/verify-horizon-evidence.test.mjs
          node scripts/check-deployment-evidence.mjs

      - name: Check public lifecycle evidence
        run: node scripts/check-testnet-lifecycle.mjs
